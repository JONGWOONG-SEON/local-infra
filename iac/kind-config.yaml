kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
containerdConfigPatches:
- |
  [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:5000"]
    endpoint = ["http://registry.local:5000"]

networking:
  disableDefaultCNI: false
  kubeProxyMode: "ipvs"

nodes:
  - role: control-plane

  - role: worker
    extraMounts:
      - hostPath: /Users/ptk-a250076-mb/3_project/dev/volumes/minio
        containerPath: /s3
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
            system-reserved: cpu=200m,memory=512Mi
            kube-reserved: cpu=200m,memory=512Mi
            enforce-node-allocatable: "pods"
            node-labels: "minio=true,nginx=true"
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
      - containerPort: 30081
        hostPort: 30081
  
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            system-reserved: cpu=200m,memory=512Mi
            kube-reserved: cpu=200m,memory=512Mi
            enforce-node-allocatable: "pods"
            node-labels: "app=airflow,airflow=true"

  - role: worker
    extraMounts:
      - hostPath: /Users/ptk-a250076-mb/3_project/dev/volumes/postgres
        containerPath: /postgresdata
      - hostPath: /Users/ptk-a250076-mb/3_project/dev/volumes/gitea
        containerPath: /data
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            system-reserved: cpu=200m,memory=512Mi
            kube-reserved: cpu=200m,memory=512Mi
            enforce-node-allocatable: "pods"
            node-labels: "postgres=true"
    extraPortMappings:
      - containerPort: 30432
        hostPort: 30432
      - containerPort: 30400
        hostPort: 30400
      - containerPort: 30082
        hostPort: 30082
      - containerPort: 22
        hostPort: 30022
  
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            system-reserved: cpu=200m,memory=512Mi
            kube-reserved: cpu=200m,memory=512Mi
            enforce-node-allocatable: "pods"
    extraPortMappings:
      - containerPort: 30180
        hostPort: 30180
      - containerPort: 30190
        hostPort: 30190
