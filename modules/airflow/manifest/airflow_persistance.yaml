---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: "airflow-pv"
  namespace: "default"
spec:
  volumeMode: "Filesystem"
  storageClassName: "local-storage"
  capacity:
    storage: "5Gi"
  accessModes:
    - "ReadWriteOnce"
  persistentVolumeReclaimPolicy: "Retain"
  hostPath:
    path: "/opt/airflow/dags"
    type: "DirectoryOrCreate"
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: "airflow"
          operator: In
          values:
            - "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "airflow-pvc"
  namespace: "default"
spec:
  storageClassName: "local-storage"
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "5Gi"
  volumeName: "airflow-pv"