apiVersion: apps/v1
kind: Deployment
metadata:
  name: "airflow-schduler"
  namespace: "default"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "airflow-schduler"
  template:
    metadata:
      labels:
        app: "airflow-schduler"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: "airflow"
                    operator: In
                    values:
                      - "true"
      containers:
        - name: "airflow-schduler"
          image: "localhost:5000/custom-airflow:0.1"
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
              - "airflow db upgrade && exec airflow scheduler"
          envFrom:
            - configMapRef:
                name: "airflow-env"
          volumeMounts:
            - name: "dags-main"
              mountPath: "/opt/airflow/dags"
      volumes:
        - name: "dags-main"
          persistentVolumeClaim:
            claimName: "airflow-pvc"
