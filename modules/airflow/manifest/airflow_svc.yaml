---
apiVersion: v1
kind: Service
metadata:
  name: "airflow-svc"
  namespace: "default"
spec:
  type: NodePort
  selector:
    app: "airflow-web"
  ports:
    - name: airflow-svc
      protocol: TCP
      port: 80
      targetPort: 8080

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "airflow-ingress"
  namespace: "default"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
    - host: "airflow.local"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: "airflow-svc"
                port:
                  number: 80
