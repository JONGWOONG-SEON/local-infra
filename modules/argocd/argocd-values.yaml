global:
  domain: argocd.local

server:
  image:
    repository: localhost:5000/quay.io/argoproj/argocd
    tag: v2.10.7
    imagePullPolicy: IfNotPresent
  extraArgs:
    - --insecure
  service:
    type: ClusterIP
    port: 80
    #nodePortHttp: 30080
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      #nginx.ingress.kubernetes.io/rewrite-target: /
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
      nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    hosts:
      - host: argocd.local
        paths:
          - path: /
            pathType: Prefix
    tls: []  

controller:
  image:
    repository: localhost:5000/quay.io/argoproj/argocd
    tag: v2.10.7
    imagePullPolicy: IfNotPresent
  nodeSelector:
    kubernetes.io/hostname: local-cluster-worker4

repoServer:
  image:
    repository: localhost:5000/quay.io/argoproj/argocd
    tag: v2.10.7
    imagePullPolicy: IfNotPresent
  nodeSelector:
    kubernetes.io/hostname: local-cluster-worker4

applicationSet:
  image:
    repository: localhost:5000/quay.io/argoproj/argocd
    tag: v2.10.7
    imagePullPolicy: IfNotPresent
  nodeSelector:
    kubernetes.io/hostname: local-cluster-worker4

configs:
  cm:
    exec.enabled: "true"
    users.anonymous.enabled: "true"
    timeout.reconciliation: 10s
  rbac:
    policy.default: role:admin
  secret:
    argocdServerAdminPassword: "$2a$10$KIDm1rksc0v0wK8kcNQNEOaH2bZsliHUM8RSBpsHjIBpWcql0xE8.⏎"
  repositories:
    helm-repo:
      name: helm-repo
      url: http://gitea-svc.default:3000/giteaadmin/helm.git
      type: git
      username: giteaadmin
      password: giteaadmin

applications:
  - name: apps-root
    namespace: argocd
    project: default
    source:
      repoURL: http://gitea-svc.default:3000/giteaadmin/helm.git
      path: argocd/
      targetRevision: main
    destination:
      server: https://kubernetes.default.svc
      namespace: argocd
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
