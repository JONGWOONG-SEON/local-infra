---
apiVersion: v1
kind: Service
metadata:
  name: "minio-svc"
  namespace: "default"
spec:
  type: NodePort
  selector:
    app: "minio"
  ports:
    - name: minio-web
      protocol: TCP
      port: 80
      targetPort: 9090
    - name: minio-api
      protocol: TCP
      port: 9000
      targetPort: 9000
      nodePort: 30081

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "minio-ingress"
  namespace: "default"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
    - host: "minio.local"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: "minio-svc"
                port:
                  number: 80
