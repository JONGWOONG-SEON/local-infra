---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: "postgres-pv"
  namespace: "default"
spec:
  volumeMode: "Filesystem"
  storageClassName: "local-storage"
  capacity:
    storage: "5Gi"
  accessModes:
    - "ReadWriteOnce"
  persistentVolumeReclaimPolicy: "Retain"
  hostPath:
    path: "/postgresdata"
    type: "DirectoryOrCreate"
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: "postgres"
          operator: In
          values:
            - "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "postgres-pvc"
  namespace: "default"
spec:
  storageClassName: "local-storage"
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "5Gi"
  volumeName: "postgres-pv"